<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#14243c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7290"/>
    </marker>
  </defs>
  <rect width="880" height="560" rx="24" fill="url(#bg)"/>

  <!-- 台阶式上升的柱体，表示因子池质量随演化提升 -->
  <g opacity="0.9">
    <rect x="96" y="352" width="46" height="88" rx="8" fill="url(#bar)" opacity="0.35"/>
    <rect x="166" y="316" width="46" height="124" rx="8" fill="url(#bar)" opacity="0.5"/>
    <rect x="236" y="272" width="46" height="168" rx="8" fill="url(#bar)" opacity="0.65"/>
    <rect x="306" y="224" width="46" height="216" rx="8" fill="url(#bar)" opacity="0.8"/>
    <rect x="376" y="176" width="46" height="264" rx="8" fill="url(#bar)"/>
  </g>
  <path d="M119 330 L189 292 L259 246 L329 196 L399 148"
        fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.75"/>

  <!-- 右侧说明 -->
  <text x="486" y="214" fill="#e8eefc" font-family="Segoe UI, Helvetica, Arial" font-size="52" font-weight="700">fevol</text>
  <text x="486" y="256" fill="#8fa6c4" font-family="Segoe UI, Helvetica, Arial" font-size="19">agent-driven factor evolution</text>
  <text x="486" y="300" fill="#5b7290" font-family="Segoe UI, Helvetica, Arial" font-size="16">reason · counterfactual · evolve · gate · reflect</text>

  <!-- 底部循环示意 -->
  <g font-family="Segoe UI, Helvetica, Arial" font-size="13" fill="#7d93ad">
    <circle cx="150" cy="486" r="5" fill="#3b82f6"/>
    <text x="166" y="491">observe pool quality</text>
    <circle cx="360" cy="486" r="5" fill="#7dd3fc"/>
    <text x="376" y="491">update search strategy</text>
  </g>
</svg>
