<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
    <style>
      .box { fill:#f7f8FA; stroke:#dfe3e8; stroke-width:1.2; }
      .t { font-family: Segoe UI, Helvetica, Arial; font-size:15px; fill:#1d1d1f; }
      .s { font-family: Segoe UI, Helvetica, Arial; font-size:12px; fill:#86868b; }
      .lab { font-family: Segoe UI, Helvetica, Arial; font-size:12px; fill:#5b7290; }
    </style>
  </defs>
  <rect width="1100" height="360" fill="#ffffff"/>

  <!-- 第一行流程 -->
  <rect class="box" x="20" y="60" width="150" height="70" rx="8"/>
  <text class="t" x="45" y="92">因子池</text>
  <text class="s" x="45" y="112">6 个种子因子</text>

  <rect class="box" x="200" y="60" width="160" height="70" rx="8"/>
  <text class="t" x="222" y="92">父代选择</text>
  <text class="s" x="222" y="112">低贡献 + 随机</text>

  <rect class="box" x="390" y="60" width="180" height="70" rx="8"/>
  <text class="t" x="412" y="92">反事实推理</text>
  <text class="s" x="412" y="112">拆结构 · 局部替换</text>

  <rect class="box" x="600" y="60" width="160" height="70" rx="8"/>
  <text class="t" x="622" y="92">子代生成</text>
  <text class="s" x="622" y="112">0-3 个完整因子</text>

  <rect class="box" x="790" y="60" width="150" height="70" rx="8"/>
  <text class="t" x="812" y="92">测量与门控</text>
  <text class="s" x="812" y="112">IC · 增量 · 相关</text>

  <rect class="box" x="965" y="60" width="115" height="70" rx="8"/>
  <text class="t" x="987" y="92">入池</text>
  <text class="s" x="987" y="112">保留 / 替换</text>

  <line x1="170" y1="95" x2="196" y2="95" stroke="#9aa0a6" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="360" y1="95" x2="386" y2="95" stroke="#9aa0a6" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="570" y1="95" x2="596" y2="95" stroke="#9aa0a6" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="760" y1="95" x2="786" y2="95" stroke="#9aa0a6" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="940" y1="95" x2="961" y2="95" stroke="#9aa0a6" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- 反馈回路 -->
  <path d="M1022 130 L1022 190 L102 190 L102 136" fill="none" stroke="#e08c2f" stroke-width="1.6"
        stroke-dasharray="6 4" marker-end="url(#a)"/>
  <rect x="470" y="168" width="200" height="44" rx="8" fill="#fff5e8" stroke="#f0d3ab"/>
  <text class="lab" x="492" y="196">本轮结果 → 策略反思</text>

  <!-- 底部说明 -->
  <text class="s" x="20" y="252">· 单个因子：有符号 RankIC（|R| 为准）· 换手成本 · 覆盖率</text>
  <text class="s" x="20" y="274">· 池增量 C：替换该父因子后 OLS 组合 RankIC 的变化</text>
  <text class="s" x="20" y="296">· 入池条件：与同伴最大相关 ≤ 0.75 且 C &gt; 0，按 S 分数择优</text>
  <text class="s" x="20" y="318">· 每轮把接受/拒绝的实测结果交给代理，写成下一轮的演化策略</text>
</svg>
